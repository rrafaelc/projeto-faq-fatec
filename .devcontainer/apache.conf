<VirtualHost *:80>
    PassEnv TURNSTILE_SITE_KEY
    PassEnv TURNSTILE_SECRET_KEY
    PassEnv SITE_URL

    DocumentRoot /var/www/projeto-faq-fatec

    <Directory /var/www/projeto-faq-fatec>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <DirectoryMatch "/\.">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
