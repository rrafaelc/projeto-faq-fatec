services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/var/www/projeto-faq-fatec:cached
    ports:
      - "80:80"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --character-set-client-handshake=FALSE
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: projeto-faq
    volumes:
      - mysql-data:/var/lib/mysql
      - "../Banco de dados SQL/script.sql:/docker-entrypoint-initdb.d/init.sql"
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
